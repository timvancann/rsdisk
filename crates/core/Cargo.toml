[package]
name = "rsdisk-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "rsdisk_core"

[[bin]]
name = "rsdisk-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dua-core = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
