[package]
name = "rsdisk"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "rsdisk_app"

[dependencies]
rsdisk-core = { path = "../core" }
# gpui-kit bundles gpui-pre and gpui-component, both pinned to gpui-pre =0.3.9, plus the
# macOS platform with font-kit and runtime shaders.
# `assets` brings the icons gpui-component's controls draw (the settings window's menus).
gpui-kit = { version = "=0.7.3", default-features = false, features = ["component", "assets"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Quick Look panel (`p`).
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSPanel"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }

[dev-dependencies]
tempfile = "3"
